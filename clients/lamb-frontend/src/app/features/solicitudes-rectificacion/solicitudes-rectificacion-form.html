<div class="pagina">
  <h2>solicitudes-rectificacion</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Matrícula
      <input type="number" formControlName="idMatricula" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Estado
      <input type="text" formControlName="estado" />
    </label>
    <label>
      Fecha solicitud
      <input type="datetime-local" formControlName="fechaSolicitud" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
