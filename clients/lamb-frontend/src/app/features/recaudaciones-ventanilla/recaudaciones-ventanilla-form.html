<div class="pagina">
  <h2>recaudaciones-ventanilla</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Pago
      <input type="number" formControlName="idPago" />
    </label>
    <label>
      ID Punto recaudación
      <input type="number" formControlName="idPuntoRecaudacion" />
    </label>
    <label>
      Cajero
      <input type="text" formControlName="cajero" />
    </label>
    <label>
      Fecha registro
      <input type="datetime-local" formControlName="fechaRegistro" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
