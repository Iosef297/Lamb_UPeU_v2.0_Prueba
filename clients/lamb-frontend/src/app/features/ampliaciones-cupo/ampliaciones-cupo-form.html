<div class="pagina">
  <h2>ampliaciones-cupo</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Sección
      <input type="number" formControlName="idSeccion" />
    </label>
    <label>
      Cupo adicional
      <input type="number" formControlName="cupoAdicional" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Autorizado por
      <input type="text" formControlName="autorizadoPor" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
