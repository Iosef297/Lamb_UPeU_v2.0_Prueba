<div class="pagina">
  <h2>movilidades-estudiantiles</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      Institución destino
      <input type="text" formControlName="institucionDestino" />
    </label>
    <label>
      Tipo movilidad
      <input type="text" formControlName="tipoMovilidad" />
    </label>
    <label>
      Periodo
      <input type="text" formControlName="periodo" />
    </label>
    <label>
      Fecha inicio
      <input type="date" formControlName="fechaInicio" />
    </label>
    <label>
      Fecha fin
      <input type="date" formControlName="fechaFin" />
    </label>
    <label>
      Estado
      <input type="text" formControlName="estado" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
