<div class="pagina">
  <h2>reclamos-pago</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      ID Pago
      <input type="number" formControlName="idPago" />
    </label>
    <label>
      Motivo
      <textarea formControlName="motivo"></textarea>
    </label>
    <label>
      Estado
      <input type="text" formControlName="estado" />
    </label>
    <label>
      Fecha reclamo
      <input type="datetime-local" formControlName="fechaReclamo" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
