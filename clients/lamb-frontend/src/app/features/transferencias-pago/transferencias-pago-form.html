<div class="pagina">
  <h2>transferencias-pago</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Pago origen
      <input type="number" formControlName="idPagoOrigen" />
    </label>
    <label>
      ID Pago destino
      <input type="number" formControlName="idPagoDestino" />
    </label>
    <label>
      Monto
      <input type="number" formControlName="monto" step="0.01" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Fecha transferencia
      <input type="datetime-local" formControlName="fechaTransferencia" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
