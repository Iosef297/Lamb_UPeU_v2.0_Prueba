<div class="pagina">
  <h2>historial-estados-matricula</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Matrícula
      <input type="number" formControlName="idMatricula" />
    </label>
    <label>
      Estado anterior
      <input type="text" formControlName="estadoAnterior" />
    </label>
    <label>
      Estado nuevo
      <input type="text" formControlName="estadoNuevo" />
    </label>
    <label>
      Fecha cambio
      <input type="datetime-local" formControlName="fechaCambio" />
    </label>
    <label>
      Observación
      <input type="text" formControlName="observacion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
