<div class="pagina">
  <h2>reservas-vacante</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Sección
      <input type="number" formControlName="idSeccion" />
    </label>
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      Fecha reserva
      <input type="date" formControlName="fechaReserva" />
    </label>
    <label>
      Vigencia hasta
      <input type="date" formControlName="vigenciaHasta" />
    </label>
    <label>
      Estado
      <input type="text" formControlName="estado" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
