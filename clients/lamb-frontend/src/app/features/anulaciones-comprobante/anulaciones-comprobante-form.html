<div class="pagina">
  <h2>anulaciones-comprobante</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Documento
      <input type="number" formControlName="idDocumentoPago" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Fecha anulación
      <input type="datetime-local" formControlName="fechaAnulacion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
