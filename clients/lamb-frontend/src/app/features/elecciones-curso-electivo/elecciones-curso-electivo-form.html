<div class="pagina">
  <h2>elecciones-curso-electivo</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      ID Curso
      <input type="number" formControlName="idCurso" />
    </label>
    <label>
      Periodo
      <input type="text" formControlName="periodo" />
    </label>
    <label>
      Fecha elección
      <input type="datetime-local" formControlName="fechaEleccion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
