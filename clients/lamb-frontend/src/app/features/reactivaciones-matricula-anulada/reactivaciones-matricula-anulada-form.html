<div class="pagina">
  <h2>reactivaciones-matricula-anulada</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Matrícula
      <input type="number" formControlName="idMatricula" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Fecha reactivación
      <input type="datetime-local" formControlName="fechaReactivacion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
