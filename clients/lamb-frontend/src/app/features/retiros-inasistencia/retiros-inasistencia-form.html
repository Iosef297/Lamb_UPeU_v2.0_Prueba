<div class="pagina">
  <h2>retiros-inasistencia</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Matrícula
      <input type="number" formControlName="idMatricula" />
    </label>
    <label>
      N° inasistencias
      <input type="number" formControlName="numeroInasistencias" />
    </label>
    <label>
      Fecha retiro
      <input type="datetime-local" formControlName="fechaRetiro" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
