<div class="pagina">
  <h2>liberaciones-excepcionales-prerrequisito</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      ID Curso
      <input type="number" formControlName="idCurso" />
    </label>
    <label>
      ID Prerrequisito
      <input type="number" formControlName="idPrerrequisito" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Fecha autorización
      <input type="datetime-local" formControlName="fechaAutorizacion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
