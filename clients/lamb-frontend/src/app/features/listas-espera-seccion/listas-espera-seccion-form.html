<div class="pagina">
  <h2>listas-espera-seccion</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Sección
      <input type="number" formControlName="idSeccion" />
    </label>
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      Posición
      <input type="number" formControlName="posicion" />
    </label>
    <label>
      Fecha inscripción
      <input type="date" formControlName="fechaInscripcion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
