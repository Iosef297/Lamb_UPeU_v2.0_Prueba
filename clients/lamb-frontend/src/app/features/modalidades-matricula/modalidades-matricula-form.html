<div class="pagina">
  <h2>Modalidad de matrícula</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Código
      <input type="text" formControlName="codigo" />
    </label>
    <label>
      Nombre
      <input type="text" formControlName="nombre" />
    </label>
    <label>
      Descripción
      <input type="text" formControlName="descripcion" />
    </label>
    <label>
      Modalidad de estudio (presencial/virtual/semipresencial)
      <select formControlName="idModalidadEstudio">
        <option [ngValue]="null">Seleccione...</option>
        @for (m of modalidadesEstudio(); track m.id) {
          <option [ngValue]="m.id">{{ m.nombre }}</option>
        }
      </select>
    </label>
    <label>
      Artículo legal
      <input type="text" formControlName="articuloLegal" />
    </label>
    <label>
      Créditos mínimos
      <input type="number" formControlName="creditosMinimos" />
    </label>
    <label>
      Días hábiles límite
      <input type="number" formControlName="diasHabilesLimite" />
    </label>
    <label>
      Máx. veces desaprobado
      <input type="number" formControlName="maxVecesDesaprobado" />
    </label>
    <label>
      <input type="checkbox" formControlName="requierePago" />
      Requiere pago
    </label>
    <label>
      <input type="checkbox" formControlName="activo" />
      Activo
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
