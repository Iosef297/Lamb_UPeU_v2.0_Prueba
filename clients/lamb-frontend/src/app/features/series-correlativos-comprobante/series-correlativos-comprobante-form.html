<div class="pagina">
  <h2>series-correlativos-comprobante</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Tipo documento
      <input type="text" formControlName="tipoDocumento" />
    </label>
    <label>
      Serie
      <input type="text" formControlName="serie" />
    </label>
    <label>
      Correlativo actual
      <input type="number" formControlName="correlativoActual" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
