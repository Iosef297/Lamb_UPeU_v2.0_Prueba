<div class="pagina">
  <h2>movimientos</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Cuenta
      <input type="number" formControlName="idCuenta" />
    </label>
    <label>
      Tipo
      <input type="text" formControlName="tipo" />
    </label>
    <label>
      Monto
      <input type="number" formControlName="monto" step="0.01" />
    </label>
    <label>
      Fecha movimiento
      <input type="datetime-local" formControlName="fechaMovimiento" />
    </label>
    <label>
      Descripción
      <input type="text" formControlName="descripcion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
