<div class="pagina">
  <h2>tarifarios-escuela-ciclo</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Concepto
      <input type="number" formControlName="idConceptoPago" />
    </label>
    <label>
      ID Escuela
      <input type="number" formControlName="idEscuela" />
    </label>
    <label>
      Ciclo
      <input type="text" formControlName="ciclo" />
    </label>
    <label>
      Monto
      <input type="number" formControlName="monto" step="0.01" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
