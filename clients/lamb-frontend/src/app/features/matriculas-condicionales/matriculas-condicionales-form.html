<div class="pagina">
  <h2>matriculas-condicionales</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Matrícula
      <input type="number" formControlName="idMatricula" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Fecha condición
      <input type="date" formControlName="fechaCondicion" />
    </label>
    <label>
      <input type="checkbox" formControlName="levantada" />
      Levantada
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
