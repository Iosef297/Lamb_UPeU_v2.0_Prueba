<div class="pagina">
  <h2>estados-cobro</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Código
      <input type="text" formControlName="codigo" />
    </label>
    <label>
      Nombre
      <input type="text" formControlName="nombre" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
