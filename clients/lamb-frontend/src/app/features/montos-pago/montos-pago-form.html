<div class="pagina">
  <h2>montos-pago</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Detalle cobro
      <input type="number" formControlName="idDetalleCobro" />
    </label>
    <label>
      ID Pago
      <input type="number" formControlName="idPago" />
    </label>
    <label>
      Monto
      <input type="number" formControlName="monto" step="0.01" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
