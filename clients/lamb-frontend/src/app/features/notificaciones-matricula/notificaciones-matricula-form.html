<div class="pagina">
  <h2>notificaciones-matricula</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Matrícula
      <input type="number" formControlName="idMatricula" />
    </label>
    <label>
      Tipo
      <input type="text" formControlName="tipo" />
    </label>
    <label>
      Canal
      <input type="text" formControlName="canal" />
    </label>
    <label>
      Fecha envío
      <input type="datetime-local" formControlName="fechaEnvio" />
    </label>
    <label>
      Estado envío
      <input type="text" formControlName="estadoEnvio" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
