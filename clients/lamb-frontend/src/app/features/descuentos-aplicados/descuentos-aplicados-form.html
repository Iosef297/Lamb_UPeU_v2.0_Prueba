<div class="pagina">
  <h2>descuentos-aplicados</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      ID Tipo descuento
      <input type="number" formControlName="idTipoDescuento" />
    </label>
    <label>
      Periodo
      <input type="text" formControlName="periodo" />
    </label>
    <label>
      Monto
      <input type="number" formControlName="monto" step="0.01" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
