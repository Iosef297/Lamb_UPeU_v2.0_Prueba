<div class="pagina">
  <h2>anulaciones-masivas-impago</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Periodo
      <input type="text" formControlName="periodo" />
    </label>
    <label>
      Total anuladas
      <input type="number" formControlName="totalMatriculasAnuladas" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Fecha ejecución
      <input type="datetime-local" formControlName="fechaEjecucion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
