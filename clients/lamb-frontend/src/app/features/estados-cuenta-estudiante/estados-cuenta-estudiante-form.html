<div class="pagina">
  <h2>estados-cuenta-estudiante</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Persona
      <input type="number" formControlName="idPersona" />
    </label>
    <label>
      Periodo
      <input type="text" formControlName="periodo" />
    </label>
    <label>
      Saldo final
      <input type="number" formControlName="saldoFinal" step="0.01" />
    </label>
    <label>
      Fecha generación
      <input type="datetime-local" formControlName="fechaGeneracion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
